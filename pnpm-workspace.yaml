# The studio app and the marketing site are workspace packages.
packages:
  - website
  - studio

# eslint-import-resolver-typescript >= 3.7 pulls in unrs-resolver, whose
# postinstall script is blocked by the supply-chain policy. Pin the last
# release that does not depend on it (still satisfies eslint-config-next ^3.5.2).
overrides:
  eslint-import-resolver-typescript: 3.6.3

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20261019.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261019.1'
  - '@cloudflare/workerd-linux-64@1.20261019.1'
  - '@cloudflare/workerd-linux-arm64@1.20261019.1'
  - '@cloudflare/workerd-windows-64@1.20261019.1'
  - miniflare@5.20261019.0-beta
  - workerd@1.20261019.1
  - wrangler@4.151.2
